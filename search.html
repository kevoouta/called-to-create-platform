<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results | Called to Create</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Bebas Neue & Decalotype -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Decalotype:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              forest: '#132519',
              frost: '#98A869',
              gray: '#212121',
              white: '#FFFFFF',
            }
          },
          fontFamily: {
            heading: ['"Bebas Neue"', 'sans-serif'],
            sans: ['Decalotype', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="site-analytics.js" defer></script>
</head>
<body class="bg-brand-forest text-brand-white font-sans antialiased selection:bg-brand-frost selection:text-brand-forest min-h-screen flex flex-col relative bg-[url('Background.png')] bg-repeat bg-center">

  <div class="fixed inset-0 bg-brand-forest/95 pointer-events-none -z-10"></div>

  <!-- Header -->
  <header class="flex flex-col md:flex-row justify-between items-center px-6 md:px-10 py-4 border-b border-brand-gray/60 gap-4 sticky top-0 bg-brand-forest/95 backdrop-blur-md z-40">
    <a href="index.html" class="inline-block transition-transform hover:scale-105">
      <img src="C2C Logo (White).png" alt="Called to Create Logo" class="h-12 md:h-16 w-auto object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
      <div class="text-3xl font-heading tracking-widest text-brand-white hover:text-brand-frost transition-colors hidden">CALLED TO CREATE</div>
    </a>
    
    <!-- Active Search Bar -->
    <form action="search.html" method="GET" class="w-full md:w-1/3 relative">
      <input 
        type="text" 
        id="pageSearchInput"
        name="q"
        placeholder="Search courses, digital assets, topics..." 
        class="w-full bg-brand-gray border border-gray-700 text-brand-white px-4 py-2 pl-10 pr-4 rounded-full text-sm focus:outline-none focus:border-brand-frost transition-all placeholder-gray-400 font-sans"
      />
      <button type="submit" class="absolute left-3.5 top-2.5 text-gray-400 hover:text-brand-frost transition-colors cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </button>
    </form>

    <nav class="flex items-center space-x-6 text-sm font-medium">
      <a href="index.html" class="text-gray-300 hover:text-brand-white transition-colors text-xs">Home</a>
      <a href="explore.html" class="text-gray-300 hover:text-brand-white transition-colors text-xs">Explore</a>
      <a href="shop.html" class="text-gray-300 hover:text-brand-white transition-colors text-xs">Digital Assets</a>
      <a href="how-it-works.html" class="text-gray-300 hover:text-brand-white transition-colors text-xs">How It Works</a>
    </nav>

    <!-- Account Action Triggers (Dynamic Auth Container) -->
    <div id="navAuthButtons" class="flex items-center space-x-4">
      <button onclick="openAuthDrawer('login')" class="text-xs font-sans font-semibold text-gray-300 hover:text-brand-white transition-colors px-3 py-2 cursor-pointer">
        Log In
      </button>
      <button onclick="openAuthDrawer('signup')" class="bg-brand-frost text-brand-forest px-5 py-2 rounded-full font-bold hover:bg-opacity-90 transition-all transform hover:scale-105 text-xs font-sans cursor-pointer">
        Sign Up
      </button>
    </div>
  </header>

  <!-- Search Results Main Content -->
  <main class="max-w-7xl mx-auto w-full px-6 md:px-10 py-12 flex-grow space-y-8">
    
    <!-- Title Header -->
    <div class="border-b border-gray-800 pb-6 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
      <div>
        <span class="text-xs text-brand-frost font-bold uppercase tracking-widest block font-sans">Platform Search</span>
        <h1 class="text-4xl md:text-5xl font-heading tracking-wide text-brand-white mt-1">
          Search Results
        </h1>
        <p id="searchSummaryText" class="text-xs md:text-sm text-gray-400 font-sans mt-2">
          Showing matching courses and digital assets...
        </p>
      </div>

      <!-- Result Filter Tabs -->
      <div class="flex space-x-2 text-xs font-sans">
        <button onclick="filterResultType('all')" id="tab-all" class="bg-brand-frost text-brand-forest font-bold px-4 py-2 rounded-full cursor-pointer">All Results</button>
        <button onclick="filterResultType('course')" id="tab-course" class="bg-brand-gray text-gray-300 hover:text-brand-white px-4 py-2 rounded-full border border-gray-800 cursor-pointer">Courses</button>
        <button onclick="filterResultType('asset')" id="tab-asset" class="bg-brand-gray text-gray-300 hover:text-brand-white px-4 py-2 rounded-full border border-gray-800 cursor-pointer">Digital Assets</button>
      </div>
    </div>

    <!-- Results Grid -->
    <div id="searchResultsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Dynamic search cards will render here -->
    </div>

  </main>

  <!-- Slide-Out Auth Side Drawer Overlay & Drawer -->
  <div id="authDrawerOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden transition-opacity" onclick="closeAuthDrawer()"></div>

  <div id="authDrawer" class="fixed top-0 right-0 w-full max-w-md h-full bg-brand-forest border-l border-gray-800 z-50 transform translate-x-full transition-transform duration-300 flex flex-col justify-between p-8">
    <div>
      <!-- Header Tabs -->
      <div class="flex justify-between items-center border-b border-gray-800 pb-4 mb-8">
        <div class="flex space-x-6">
          <button id="tabLogin" onclick="switchAuthTab('login')" class="text-xl font-heading tracking-wide text-brand-frost border-b-2 border-brand-frost pb-1 cursor-pointer">Log In</button>
          <button id="tabSignup" onclick="switchAuthTab('signup')" class="text-xl font-heading tracking-wide text-gray-400 hover:text-brand-white pb-1 cursor-pointer">Create Account</button>
        </div>
        <button onclick="closeAuthDrawer()" class="text-gray-400 hover:text-brand-white text-lg font-bold cursor-pointer">✕</button>
      </div>

      <!-- Log In Form -->
      <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">
        <div>
          <label class="text-[10px] text-brand-frost font-bold uppercase tracking-widest block mb-2 font-sans">Email Address</label>
          <input id="loginEmail" type="email" required placeholder="creator@calledtocreate.com" class="w-full bg-brand-gray border border-gray-800 rounded-xl px-4 py-3 text-xs text-brand-white focus:outline-none focus:border-brand-frost font-sans" />
        </div>
        <div>
          <label class="text-[10px] text-brand-frost font-bold uppercase tracking-widest block mb-2 font-sans">Password</label>
          <input id="loginPassword" type="password" required placeholder="••••••••" class="w-full bg-brand-gray border border-gray-800 rounded-xl px-4 py-3 text-xs text-brand-white focus:outline-none focus:border-brand-frost font-sans" />
        </div>
        <div class="flex justify-between items-center text-xs text-gray-400 font-sans">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="rounded bg-brand-gray border-gray-800 text-brand-frost focus:ring-0" />
            <span>Remember me</span>
          </label>
          <a href="#" class="hover:text-brand-white">Forgot Password?</a>
        </div>
        
        <!-- Status Notification text for Log In -->
        <p id="loginStatus" class="text-xs hidden font-sans"></p>

        <button id="loginSubmitBtn" type="submit" class="w-full bg-brand-frost text-brand-forest font-bold py-3.5 rounded-2xl text-xs hover:bg-opacity-90 transition-all mt-4 font-sans cursor-pointer">
          Sign In to Library
        </button>
      </form>

      <!-- Sign Up Form (Hidden by default) -->
      <form id="signupForm" class="space-y-5 hidden" onsubmit="handleSignup(event)">
        <div>
          <label class="text-[10px] text-brand-frost font-bold uppercase tracking-widest block mb-2 font-sans">Full Name</label>
          <input id="signupName" type="text" required placeholder="Your Name" class="w-full bg-brand-gray border border-gray-800 rounded-xl px-4 py-3 text-xs text-brand-white focus:outline-none focus:border-brand-frost font-sans" />
        </div>
        <div>
          <label class="text-[10px] text-brand-frost font-bold uppercase tracking-widest block mb-2 font-sans">Email Address</label>
          <input id="signupEmail" type="email" required placeholder="creator@calledtocreate.com" class="w-full bg-brand-gray border border-gray-800 rounded-xl px-4 py-3 text-xs text-brand-white focus:outline-none focus:border-brand-frost font-sans" />
        </div>
        <div>
          <label class="text-[10px] text-brand-frost font-bold uppercase tracking-widest block mb-2 font-sans">Password</label>
          <input id="signupPassword" type="password" required placeholder="••••••••" class="w-full bg-brand-gray border border-gray-800 rounded-xl px-4 py-3 text-xs text-brand-white focus:outline-none focus:border-brand-frost font-sans" />
        </div>

        <!-- Status Notification text for Sign Up -->
        <p id="signupStatus" class="text-xs hidden font-sans"></p>

        <button id="signupSubmitBtn" type="submit" class="w-full bg-brand-frost text-brand-forest font-bold py-3.5 rounded-2xl text-xs hover:bg-opacity-90 transition-all mt-4 font-sans cursor-pointer">
          Create Account & Access Classes
        </button>
      </form>
    </div>

    <div class="border-t border-gray-800 pt-6 text-center text-xs text-gray-400 font-sans">
      <p>Pay-per-class model • Lifetime access included</p>
    </div>
  </div>

  <!-- Global Footer -->
  <!-- SHARED_FOOTER -->

  <!-- Supabase CDN SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Search Engine & Auth Logic -->
  <script>
    // Initialize Supabase Client globally
    const SUPABASE_URL = 'https://ecbftpfbbfvcxreszsfo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_AQZBPX4R8Q4IxQnKO2euYw_IWwlxlb9';

    window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    // Listen for Auth State Changes & Update Navigation
    document.addEventListener("DOMContentLoaded", () => {
      window.supabaseClient.auth.onAuthStateChange((event, session) => {
        currentUser = session ? session.user : null;
        updateNavForAuth(currentUser);
      });

      const urlParams = new URLSearchParams(window.location.search);
      const query = urlParams.get('q') || '';
      
      document.getElementById('pageSearchInput').value = query;
      executeSearch(query);
    });

    // Toggle Header Buttons dynamically based on auth status
    function updateNavForAuth(user) {
      const navContainer = document.getElementById('navAuthButtons');
      if (!navContainer) return;

      if (user) {
        navContainer.innerHTML = `
          <a href="library.html" class="bg-brand-frost text-brand-forest px-5 py-2 rounded-full font-bold hover:bg-opacity-90 transition-all text-xs font-sans">
            My Library
          </a>
          <button onclick="handleSignOut()" class="text-gray-400 hover:text-brand-white text-xs font-sans border border-gray-800 hover:border-gray-600 px-3 py-1.5 rounded-xl transition-all cursor-pointer">
            Sign Out
          </button>
        `;
      } else {
        navContainer.innerHTML = `
          <button onclick="openAuthDrawer('login')" class="text-xs font-sans font-semibold text-gray-300 hover:text-brand-white transition-colors px-3 py-2 cursor-pointer">
            Log In
          </button>
          <button onclick="openAuthDrawer('signup')" class="bg-brand-frost text-brand-forest px-5 py-2 rounded-full font-bold hover:bg-opacity-90 transition-all transform hover:scale-105 text-xs font-sans cursor-pointer">
            Sign Up
          </button>
        `;
      }
    }

    // Global Sign Out Function
    async function handleSignOut() {
      await window.supabaseClient.auth.signOut();
      window.location.reload();
    }

    // Side Auth Drawer Controls
    function openAuthDrawer(tab) {
      const overlay = document.getElementById('authDrawerOverlay');
      const drawer = document.getElementById('authDrawer');
      
      switchAuthTab(tab);
      
      overlay.classList.remove('hidden');
      setTimeout(() => {
        drawer.classList.remove('translate-x-full');
      }, 10);
    }

    function closeAuthDrawer() {
      const overlay = document.getElementById('authDrawerOverlay');
      const drawer = document.getElementById('authDrawer');
      
      drawer.classList.add('translate-x-full');
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 300);
    }

    function switchAuthTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const tabLogin = document.getElementById('tabLogin');
      const tabSignup = document.getElementById('tabSignup');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        tabLogin.className = "text-xl font-heading tracking-wide text-brand-frost border-b-2 border-brand-frost pb-1 cursor-pointer";
        tabSignup.className = "text-xl font-heading tracking-wide text-gray-400 hover:text-brand-white pb-1 cursor-pointer";
      } else {
        loginForm.classList.add('hidden');
        signupForm.classList.remove('hidden');
        tabSignup.className = "text-xl font-heading tracking-wide text-brand-frost border-b-2 border-brand-frost pb-1 cursor-pointer";
        tabLogin.className = "text-xl font-heading tracking-wide text-gray-400 hover:text-brand-white pb-1 cursor-pointer";
      }
    }

    // Handle User Sign In via Supabase
    async function handleLogin(event) {
      event.preventDefault();
      
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const statusText = document.getElementById('loginStatus');
      const submitBtn = document.getElementById('loginSubmitBtn');

      statusText.classList.remove('hidden', 'text-red-400');
      statusText.classList.add('text-brand-frost');
      statusText.textContent = 'Authenticating...';
      submitBtn.disabled = true;

      const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        statusText.textContent = error.message;
        statusText.classList.remove('text-brand-frost');
        statusText.classList.add('text-red-400');
        submitBtn.disabled = false;
      } else {
        statusText.textContent = 'Success! Redirecting to library...';
        setTimeout(() => {
          window.location.href = 'library.html';
        }, 1000);
      }
    }

    // Handle User Sign Up via Supabase
    async function handleSignup(event) {
      event.preventDefault();

      const fullName = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const statusText = document.getElementById('signupStatus');
      const submitBtn = document.getElementById('signupSubmitBtn');

      statusText.classList.remove('hidden', 'text-red-400');
      statusText.classList.add('text-brand-frost');
      statusText.textContent = 'Creating account...';
      submitBtn.disabled = true;

      const { data, error } = await window.supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { full_name: fullName } }
      });

      if (error) {
        statusText.textContent = error.message;
        statusText.classList.remove('text-brand-frost');
        statusText.classList.add('text-red-400');
        submitBtn.disabled = false;
      } else {
        statusText.textContent = 'Account created! Please check your email to confirm.';
      }
    }

    // Platform Catalog
    const CATALOG = [
      {
        id: 'c1',
        type: 'course',
        title: 'Cinematic Storytelling & Dark Aesthetics',
        category: 'Film & Video',
        description: 'Learn practical high-contrast lighting setups, documentary shot choices, and low-light visual mood creation.',
        details: '5 Modules • 1h 20m',
        price: 'KES 2,500',
        actionUrl: 'explore.html'
      },
      {
        id: 'c2',
        type: 'course',
        title: 'DaVinci Resolve Dark Moody Course',
        category: 'Color Grading',
        description: 'Master the Color page, Power Windows, Delta Keyer node workflows, and custom look creation for narrative projects.',
        details: '8 Modules • 2h 45m',
        price: 'KES 3,000',
        actionUrl: 'explore.html'
      },
      {
        id: 'c3',
        type: 'course',
        title: 'The Business of Creativity & Grant Writing',
        category: 'Business of Art',
        description: 'How to pitch visual proposals, structure client budgets, submit grant applications, and commercialize your art.',
        details: '6 Modules • 1h 50m',
        price: 'KES 2,000',
        actionUrl: 'explore.html'
      },
      {
        id: 'a1',
        type: 'asset',
        title: 'Dark Moody PowerGrade Collection',
        category: 'DaVinci PowerGrade',
        description: 'Non-destructive node tree presets, shadow retention keys, and low-light skin tone balancing built for Log footage.',
        details: 'ZIP • 18 MB (.drx)',
        price: 'KES 3,500',
        actionUrl: 'shop.html'
      },
      {
        id: 'a2',
        type: 'asset',
        title: 'Creative Proposal & Pitch Deck Suite',
        category: 'Template Suite',
        description: '16:9 minimalist client presentation decks, sponsor outreach layouts, and video production proposal templates.',
        details: 'PDF / Figma / Canva',
        price: 'KES 2,400',
        actionUrl: 'shop.html'
      },
      {
        id: 'a3',
        type: 'asset',
        title: '16mm Film Grain & Light Leak Pack',
        category: '4K Video FX',
        description: 'Authentic scanned film grain, flash frames, and light leak textures. Drag and drop onto premiere or resolve timelines.',
        details: '4K ProRes 422 • 3.2 GB',
        price: 'KES 2,900',
        actionUrl: 'shop.html'
      }
    ];

    let currentResults = [];
    let activeFilter = 'all';

    function executeSearch(query) {
      const q = query.toLowerCase().trim();
      const summaryText = document.getElementById('searchSummaryText');

      if (!q) {
        currentResults = CATALOG;
        summaryText.textContent = `Displaying all ${CATALOG.length} platform offerings.`;
      } else {
        currentResults = CATALOG.filter(item => 
          item.title.toLowerCase().includes(q) ||
          item.description.toLowerCase().includes(q) ||
          item.category.toLowerCase().includes(q)
        );
        summaryText.textContent = `Found ${currentResults.length} result(s) for "${query}".`;
      }

      renderResults();
    }

    function renderResults() {
      const grid = document.getElementById('searchResultsGrid');
      const filtered = currentResults.filter(item => activeFilter === 'all' || item.type === activeFilter);

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-16 border border-dashed border-gray-800 rounded-3xl bg-brand-gray/40">
            <p class="text-gray-400 font-sans text-sm">No results match your criteria.</p>
            <a href="explore.html" class="inline-block mt-4 text-xs font-bold text-brand-frost hover:underline font-sans">Browse All Courses →</a>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="bg-brand-gray border border-gray-800 rounded-2xl p-6 flex flex-col justify-between hover:border-brand-frost/60 transition-all group">
          <div class="space-y-3">
            <div class="flex justify-between items-center">
              <span class="bg-brand-frost/20 text-brand-frost text-[10px] font-bold px-2.5 py-1 rounded border border-brand-frost/30 uppercase tracking-widest font-sans">
                ${item.category}
              </span>
              <span class="text-xs font-mono text-gray-400 uppercase">${item.type}</span>
            </div>
            <h3 class="text-xl font-heading tracking-wide text-brand-white group-hover:text-brand-frost transition-colors">
              ${item.title}
            </h3>
            <p class="text-xs text-gray-400 leading-relaxed font-sans">
              ${item.description}
            </p>
          </div>

          <div class="pt-6 border-t border-gray-800 mt-6 flex items-center justify-between">
            <div>
              <p class="text-[10px] text-gray-400 font-sans">${item.details}</p>
              <p class="text-sm font-heading text-brand-frost mt-0.5">${item.price}</p>
            </div>
            <a href="${item.actionUrl}" class="bg-brand-forest hover:bg-brand-frost hover:text-brand-forest text-brand-white border border-gray-700 text-xs font-bold px-4 py-2 rounded-xl transition-all font-sans">
              View Item
            </a>
          </div>
        </div>
      `).join('');
    }

    function filterResultType(type) {
      activeFilter = type;
      
      ['all', 'course', 'asset'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === type) {
          btn.className = "bg-brand-frost text-brand-forest font-bold px-4 py-2 rounded-full cursor-pointer";
        } else {
          btn.className = "bg-brand-gray text-gray-300 hover:text-brand-white px-4 py-2 rounded-full border border-gray-800 cursor-pointer";
        }
      });

      renderResults();
    }


  </script>

</body>
</html>
