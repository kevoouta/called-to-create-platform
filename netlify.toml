[build]
  publish = "dist"
  command = "node scripts/build.mjs"

# Automatically handle clean URLs (allows visiting /explore instead of /explore.html)
# Netlify resolves the file if it exists; this rewrite keeps the path from looping back on itself.
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200

# Optional: Basic security headers for your production site
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"